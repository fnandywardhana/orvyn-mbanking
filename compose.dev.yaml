# Local Postgres for development and tests (port 55432 avoids clashing with other services on this host)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orvyn
      POSTGRES_PASSWORD: orvyn
      POSTGRES_DB: orvyn
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: /var/lib/postgresql/data
